[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "kouun-db"
version = "0.1.0"
description = "Weather observation data collection and analysis for agriculture"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "requests>=2.32,<3",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
